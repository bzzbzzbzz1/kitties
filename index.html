<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Милые котики с сердечками</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #fff5f5;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: auto;
            z-index: 10;
            position: relative;
        }
        h1 {
            color: #ff69b4;
            animation: colorPulse 2s infinite;
        }
        @keyframes colorPulse {
            0%, 100% { color: #ff69b4; }
            50% { color: #ff1493; }
        }
        button {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            transition: all 0.3s ease;
            font-weight: bold;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.6);
        }
        button:active {
            transform: translateY(1px);
        }
        #catImage {
            position: relative;
            margin-top: 30px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        img.loaded {
            opacity: 1;
            transform: scale(1);
        }
        .loading {
            color: #666;
            font-style: italic;
            margin-top: 15px;
        }
        /* Стили для сердечек */
        .heart {
            position: fixed;
            top: -20px;
            width: 20px;
            height: 20px;
            background-color: #ff69b4;
            transform: rotate(45deg);
            z-index: 1;
            pointer-events: none;
        }
        .heart::before,
        .heart::after {
            content: "";
            background-color: #ff69b4;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            position: absolute;
        }
        .heart::before {
            top: -10px;
            left: 0;
        }
        .heart::after {
            top: 0;
            right: -10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😺 Милые котики ждут вас!</h1>
        <p>Нажмите кнопку, чтобы увидеть нового котика и сердечки:</p>
        <button onclick="loadCat()">Ещё котика и сердечек! ❤️</button>
        <div id="loading" class="loading" style="display: none;">Загружаем котика...</div>
        <div id="catImage"></div>
    </div>

    <script>
        // Функция для создания и анимации сердечек
        function createHearts() {
            const button = document.querySelector('button');
            const rect = button.getBoundingClientRect();
            const heartCount = 15; // Количество сердечек

            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');

                // Случайная позиция вокруг кнопки
                const startX = rect.left + rect.width / 2 + (Math.random() - 0.5) * 50;
                const startY = rect.top + rect.height;

                heart.style.left = `${startX}px`;
                heart.style.top = `${startY}px`;

                // Случайный размер сердечка
                const size = 10 + Math.random() * 15;
                heart.style.width = `${size}px`;
                heart.style.height = `${size}px`;
                heart.style.opacity = '0.7';

                document.body.appendChild(heart);

                // Анимация полёта
                const endX = Math.random() * window.innerWidth;
                const flightDuration = 2000 + Math.random() * 2000; // Длительность полёта

                // Анимация через CSS
                heart.animate([
                    { transform: `translate(0, 0) rotate(45deg)`, opacity: 0.7 },
                    { transform: `translate(${endX - startX}px, -${window.innerHeight + 100}px) rotate(225deg)`, opacity: 0 }
                ], {
                    duration: flightDuration,
                    easing: 'cubic-bezier(0.2, 0.8, 0.3, 1)'
                });

                // Удаляем сердечко после анимации
                setTimeout(() => {
                    heart.remove();
                }, flightDuration);
            }
        }

        // Функция для загрузки случайного фото котика
        async function loadCat() {
            createHearts(); // Запускаем анимацию сердечек

            const imageContainer = document.getElementById('catImage');
            const loadingText = document.getElementById('loading');

            // Показываем индикатор загрузки
            loadingText.style.display = 'block';
            imageContainer.innerHTML = '';

            try {
                // Запрос к API для получения случайного фото котика
                const response = await fetch('https://api.thecatapi.com/v1/images/search');
                if (!response.ok) {
                    throw new Error('Ошибка сети');
                }
                const data = await response.json();
                const catUrl = data[0].url;

                // Создаём и вставляем изображение
                const img = document.createElement('img');
                img.src = catUrl;
                img.alt = "Милый котик";
                imageContainer.appendChild(img);

                // Ждём загрузки изображения, затем применяем анимацию появления
                img.onload = () => {
                    loadingText.style.display = 'none';
                    img.classList.add('loaded');
                };

                // Если картинка не загрузилась по какой-то причине
                img.onerror = () => {
                    loadingText.style.display = 'none';
                    imageContainer.innerHTML = '<p style="color: red;">Не удалось загрузить котика. Попробуйте ещё раз.</p>';
                };
            } catch (error) {
                loadingText.style.display = 'none';
                imageContainer.innerHTML = '<p style="color: red;">Не удалось загрузить котика. Попробуйте ещё раз.</p>';
                console.error('Ошибка:', error);
            }
        }

        // Загружаем первого котика сразу при открытии страницы
        document.addEventListener('DOMContentLoaded', loadCat);
    </script>
</body>
</html>
